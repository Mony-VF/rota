table{border-collapse:separate;border-spacing:0;font-size:10px;width:max-content;min-width:100%;}

    if(emp.oc){html+='<tr class="dsep"><td class="tc">TL</td><td class="nc">ON Call</td>';days.forEach((d,i)=>{const isWE=[5,6].includes(i);const isToday=d.getTime()===TODAY.getTime();const key=dateToKey(d);const nm=key?((MONTHS[key.month]||{}).oc||{})[key.day]||'':'';html+='<td class="'+(isWE?'wkend ':'')+' day-col'+(isToday?' today-col':'')+'"><span class="oc-chip">'+nm+'</span></td>';});html+='</tr>';return;}
    const ds=(emp.team!==prevTeam)?'dsep':'';prevTeam=emp.team;
    html+='<tr class="'+ds+'"><td class="tc">'+emp.team+'</td><td class="'+(myMode&&emp.id===myEmpId?'nc me':'nc')+'" title="'+emp.name+'">'+emp.name+'</td>';
    days.forEach((d,i)=>{const isWE=[5,6].includes(i);const isToday=d.getTime()===TODAY.getTime();const key=dateToKey(d);let cd=null,note=null;if(key){cd=((emp.s||{})[key.month]||{})[key.day]||null;note=((emp.n||{})[key.month]||{})[key.day]||null;}const lbl=String(d.getDate()).padStart(2,'0')+' '+DN[i];html+='<td class="'+(isWE?'wkend ':'')+' day-col'+(isToday?' today-col':'')+'" style="position:relative">'+pillHtml(cd,note,emp.name,lbl)+'</td>';});
    html+='</tr>';
  });
  html+='</tbody></table>';
  const out=document.getElementById('tblOut');out.innerHTML=html;attachNotes(out);
}
function renderMonth(){
  const m=MONTHS[curMonth];const emps=getVisible();const days=Array.from({length:m.days},(_,i)=>i+1);
  let html='<table><thead><tr><th class="tc">Team</th><th class="nc">Name</th>';
  days.forEach(d=>{const wS=m.ws.includes(d)?'wksep':'';const wE=m.we.includes(d)?'wkend':'';const isToday=(curMonth===TODAY.getMonth()+1&&d===TODAY.getDate()&&TODAY.getFullYear()===2026);html+='<th class="'+[wS,wE,isToday?'today-col':''].filter(Boolean).join(' ')+'" style="min-width:28px"><span style="display:block;font-size:8px;opacity:.7">'+String(d).padStart(2,'0')+'</span><span style="display:block;font-size:8px">'+m.dn[d-1]+'</span></th>';});
  html+='</tr></thead><tbody>';
  let prevTeam=null;
  emps.forEach(emp=>{
    if(emp.oc){html+='<tr class="dsep"><td class="tc">TL</td><td class="nc">ON Call</td>';days.forEach(d=>{const wS=m.ws.includes(d)?'wksep':'';const wE=m.we.includes(d)?'wkend':'';const isToday=(curMonth===TODAY.getMonth()+1&&d===TODAY.getDate()&&TODAY.getFullYear()===2026);html+='<td class="'+[wS,wE,isToday?'today-col':''].filter(Boolean).join(' ')+'"><span class="oc-chip">'+(m.oc[d]||'')+'</span></td>';});html+='</tr>';return;}
    const ds=(emp.team!==prevTeam)?'dsep':'';prevTeam=emp.team;
    html+='<tr class="'+ds+'"><td class="tc">'+emp.team+'</td><td class="'+(myMode&&emp.id===myEmpId?'nc me':'nc')+'" title="'+emp.name+'">'+emp.name+'</td>';
    days.forEach(d=>{const wS=m.ws.includes(d)?'wksep':'';const wE=m.we.includes(d)?'wkend':'';const isToday=(curMonth===TODAY.getMonth()+1&&d===TODAY.getDate()&&TODAY.getFullYear()===2026);const cd=((emp.s||{})[curMonth]||{})[d]||null;const note=((emp.n||{})[curMonth]||{})[d]||null;const lbl=String(d).padStart(2,'0')+' '+m.dn[d-1];html+='<td class="'+[wS,wE,isToday?'today-col':''].filter(Boolean).join(' ')+'" style="position:relative">'+pillHtml(cd,note,emp.name,lbl)+'</td>';});
    html+='</tr>';
  });
  html+='</tbody></table>';
  const out=document.getElementById('tblOut');out.innerHTML=html;attachNotes(out);
  if(curMonth===TODAY.getMonth()+1&&TODAY.getFullYear()===2026){setTimeout(()=>{const tc=out.querySelector('th.today-col');if(tc)tc.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});},80);}
}
function render(){if(viewMode==='week')renderWeek();else renderMonth();}
function renderLegend(){document.getElementById('legend').innerHTML='<span style="font-size:11px;color:var(--muted);margin-right:4px;align-self:center">Key:</span>'+LEGEND_CODES.map(x=>'<span class="lchip l'+x.c+'"><b>'+x.c+'</b> '+x.l+'</span>').join('');}
init();
</script>
