<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>UK Rota 2026</title>
<style>
:root{
  --bg:#0b1220;--panel:#0f1a33;--stroke:rgba(255,255,255,.12);
  --text:#eaf0ff;--muted:#b9c4e6;--accent:#6ea8ff;--radius:12px;
  --c-E:#689B99;--c-SE:#689B99;--c-1:#65F2C4;--c-L:#437F7F;--c-SL:#437F7F;
  --c-W:#89938D;--c-SN:#65F2C4;--c-H:#6C688F;--c-HD:#D9D9D9;--c-S:#A9170C;
  --c-MA:#02ABDE;--c-T:#D47233;--c-M:#94DCF8;--c-CL:#87D2E6;--c-DL:#87D2E6;
  --st:56px;--sn:130px;
}
@media(min-width:480px){:root{--st:70px;--sn:160px;}}
@media(min-width:768px){:root{--st:80px;--sn:190px;}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  background:radial-gradient(900px 500px at 20% -10%,rgba(110,168,255,.18),transparent 55%),
             radial-gradient(900px 500px at 80% 0%,rgba(124,92,255,.16),transparent 55%),var(--bg);
  color:var(--text);min-height:100vh;overscroll-behavior:none;}

/* ── TOP BAR ── */
.bar{position:sticky;top:0;z-index:20;background:rgba(11,18,32,.96);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--stroke);padding:10px 12px 8px;}
.bar-row1{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.bar-title{font-size:15px;font-weight:700;flex:1;}

/* view toggle */
.view-tabs{display:flex;gap:0;border:1px solid var(--stroke);border-radius:8px;overflow:hidden;}
.vtab{background:rgba(255,255,255,.06);border:none;color:var(--muted);
  padding:7px 13px;font-size:13px;cursor:pointer;transition:background .15s,color .15s;min-height:34px;}
.vtab:first-child{border-right:1px solid var(--stroke);}
.vtab.active{background:rgba(110,168,255,.25);color:var(--text);font-weight:600;}

/* week nav */
.week-nav{display:flex;align-items:center;gap:6px;margin-bottom:8px;}
.wnav-btn{background:rgba(255,255,255,.08);border:1px solid var(--stroke);color:var(--text);
  border-radius:8px;width:34px;height:34px;font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.wnav-btn:active{background:rgba(255,255,255,.15);}
.week-label{flex:1;text-align:center;font-size:13px;font-weight:600;color:var(--text);}
.wnav-today{background:rgba(110,168,255,.18);border:1px solid rgba(110,168,255,.4);
  color:var(--accent);border-radius:8px;padding:7px 10px;font-size:12px;
  cursor:pointer;white-space:nowrap;font-weight:600;height:34px;}

/* month row */
.month-row{display:flex;gap:6px;align-items:center;margin-bottom:8px;}
.month-tabs{display:flex;gap:6px;flex:1;}
.mtab{background:rgba(255,255,255,.08);border:1px solid var(--stroke);
  color:var(--muted);border-radius:8px;padding:7px 14px;font-size:13px;
  cursor:pointer;transition:background .15s,color .15s;min-height:34px;}
.mtab.active{background:rgba(110,168,255,.25);border-color:rgba(110,168,255,.5);color:var(--text);font-weight:600;}

/* filter row */
.bar-row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.filter-group{display:flex;gap:6px;align-items:center;flex:1;min-width:0;}
.filter-group select{flex:1;min-width:0;background:rgba(255,255,255,.08);border:1px solid var(--stroke);
  color:var(--text);border-radius:8px;padding:7px 10px;font-size:13px;outline:none;min-height:34px;}
.mybtn{background:rgba(110,168,255,.18);border:1px solid rgba(110,168,255,.4);
  color:var(--accent);border-radius:8px;padding:7px 12px;font-size:13px;
  cursor:pointer;white-space:nowrap;min-height:34px;font-weight:600;}
.mybtn.active{background:rgba(110,168,255,.35);color:#fff;}

/* ── WRAP ── */
.wrap{padding:10px 8px 40px;}

/* ── TABLE ── */
.tbl-wrap{overflow-x:auto;overflow-y:visible;border:1px solid var(--stroke);border-radius:var(--radius);
  background:rgba(255,255,255,.02);-webkit-overflow-scrolling:touch;}
table{border-collapse:separate;border-spacing:0;font-size:10px;width:max-content;min-width:100%;}
th,td{padding:3px 2px;text-align:center;vertical-align:middle;
  border-bottom:0.5px solid rgba(255,255,255,.06);white-space:nowrap;position:relative;}
th{background:rgba(12,20,44,.98);color:var(--muted);font-weight:500;
  position:sticky;top:0;z-index:8;border-bottom:1px solid rgba(255,255,255,.12);}
th.tc,td.tc{position:sticky;left:0;z-index:9;width:var(--st);min-width:var(--st);max-width:var(--st);
  background:var(--panel)!important;border-right:0.5px solid rgba(255,255,255,.10);
  text-align:left;padding-left:6px;font-size:9px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;}
th.nc,td.nc{position:sticky;left:var(--st);z-index:9;width:var(--sn);min-width:var(--sn);max-width:var(--sn);
  background:var(--panel)!important;border-right:0.5px solid rgba(255,255,255,.10);
  text-align:left;padding-left:6px;font-weight:600;overflow:hidden;text-overflow:ellipsis;font-size:11px;}
th.tc,th.nc{z-index:10;}
td.nc.me{color:var(--accent);}

/* week view — wider day columns since only 7 days */
.week-view th.day-col,
.week-view td.day-col{min-width:48px;}
@media(min-width:400px){.week-view th.day-col,.week-view td.day-col{min-width:58px;}}
@media(min-width:600px){.week-view th.day-col,.week-view td.day-col{min-width:72px;}}

/* day header in week view */
.dh-num{display:block;font-size:12px;font-weight:700;color:var(--text);}
.dh-name{display:block;font-size:10px;color:var(--muted);}

.wkend{background:rgba(255,255,255,.02);}
.wksep{border-left:2px solid rgba(110,168,255,.6)!important;}
tr.dsep td{border-top:2px solid rgba(110,168,255,.7)!important;}

.pill{display:inline-flex;align-items:center;justify-content:center;
  padding:3px 7px;border-radius:7px;font-size:11px;font-weight:700;
  border:1px solid rgba(0,0,0,.3);color:#000;min-width:30px;
  cursor:pointer;user-select:none;}
/* bigger pills in week view on mobile */
.week-view .pill{padding:5px 10px;font-size:13px;min-width:38px;border-radius:9px;}
@media(min-width:480px){.pill{font-size:11px;min-width:30px;padding:2px 7px;}}
.pill.pH,.pill.pS{color:#fff!important;}
.pE{background:var(--c-E)}.pSE{background:var(--c-SE)}.p1{background:var(--c-1)}
.pL{background:var(--c-L)}.pSL{background:var(--c-SL)}.pW{background:var(--c-W)}
.pSN{background:var(--c-SN)}.pH{background:var(--c-H)}.pHD{background:var(--c-HD)}
.pS{background:var(--c-S)}.pMA{background:var(--c-MA)}.pT{background:var(--c-T)}
.pM{background:var(--c-M)}.pCL{background:var(--c-CL)}.pDL{background:var(--c-DL)}
.pill.has-note::after{content:'';position:absolute;top:2px;right:2px;width:5px;height:5px;
  border-radius:50%;background:#ff3b3b;box-shadow:0 0 0 1.5px rgba(0,0,0,.3);}
.pill.dim{background:transparent!important;border-color:transparent!important;
  color:rgba(185,196,230,.18)!important;font-weight:400;cursor:default;}
.oc-chip{display:inline-block;background:rgba(255,255,255,.06);border:0.5px solid rgba(255,255,255,.12);
  border-radius:999px;padding:2px 7px;font-size:9px;color:var(--muted);}

/* today column */
th.today-col{background:rgba(110,168,255,.18)!important;color:var(--accent)!important;}
td.today-col{background:rgba(110,168,255,.07)!important;}
.dh-num.today-num{color:var(--accent);font-size:14px;}

/* empty week notice */
.empty-notice{padding:32px 20px;text-align:center;color:var(--muted);font-size:14px;}

/* ── NOTE MODAL ── */
#noteMask{display:none;position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.55);}
#noteMask.show{display:flex;align-items:flex-end;justify-content:center;}
@media(min-width:480px){#noteMask.show{align-items:center;}}
#noteCard{background:var(--panel);border:1px solid rgba(110,168,255,.25);
  border-radius:16px 16px 0 0;padding:20px 20px 32px;width:100%;max-width:480px;
  box-shadow:0 -8px 40px rgba(0,0,0,.5);}
@media(min-width:480px){#noteCard{border-radius:16px;padding:20px;}}
#noteCard h3{font-size:14px;font-weight:700;margin-bottom:6px;color:var(--accent);}
#noteCard p{font-size:13px;color:var(--text);line-height:1.6;margin-bottom:16px;}
#noteClose{width:100%;background:rgba(255,255,255,.1);border:1px solid var(--stroke);
  color:var(--text);border-radius:10px;padding:12px;font-size:15px;cursor:pointer;}

/* ── LEGEND ── */
.legend{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px;}
.lchip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;
  border-radius:999px;border:1px solid rgba(0,0,0,.25);font-size:11px;color:#000;}
.lchip.lH,.lchip.lS{color:#fff!important;}
.lchip.lE{background:var(--c-E)}.lchip.lSE{background:var(--c-SE)}.lchip.l1{background:var(--c-1)}
.lchip.lL{background:var(--c-L)}.lchip.lSL{background:var(--c-SL)}.lchip.lW{background:var(--c-W)}
.lchip.lSN{background:var(--c-SN)}.lchip.lH{background:var(--c-H)}.lchip.lHD{background:var(--c-HD)}
.lchip.lS{background:var(--c-S)}.lchip.lMA{background:var(--c-MA)}.lchip.lT{background:var(--c-T)}
.lchip.lM{background:var(--c-M)}.lchip.lCL{background:var(--c-CL)}.lchip.lDL{background:var(--c-DL)}
</style>
</head>

</div>

<div class="wrap">

  {c:'E',l:'Early'},{c:'SE',l:'Sat Early'},{c:'1',l:'Regular'},
  {c:'L',l:'Late'},{c:'SL',l:'Sat Late'},{c:'SN',l:'Sat Normal'},

  {c:'S',l:'Sick'},{c:'MA',l:'Medical Appt'},{c:'T',l:'Training'},
  {c:'M',l:'Mat/Pat Leave'},{c:'CL',l:'Compassionate'},{c:'DL',l:'Dependency'},
];

// ── HELPERS ──────────────────────────────────────────────────────────────────

// Get Monday of the week containing `date`
function getMondayOf(date){
  const d=new Date(date);
  const day=d.getDay(); // 0=Sun
  const diff=day===0?-6:1-day; // shift to Monday
  d.setDate(d.getDate()+diff);
  d.setHours(0,0,0,0);
  return d;
}

// Add N weeks to a date
function addWeeks(date,n){
  const d=new Date(date);
  d.setDate(d.getDate()+n*7);
  return d;
}

// Format a date as "5 Jul"
function fmtShort(d){
  return d.getDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
}

// Given a JS Date, return {month (1-12), day} or null if outside our data range
function dateToRotaKey(d){
  const m=d.getMonth()+1;
  const day=d.getDate();
  const y=d.getFullYear();
  if(y!==2026) return null;
  if(!MONTHS[m]) return null;
  if(day<1||day>MONTHS[m].days) return null;
  return {month:m,day};
}

// ── STATE ─────────────────────────────────────────────────────────────────────
const TODAY=new Date();
TODAY.setHours(0,0,0,0);

let viewMode='week'; // 'week' | 'month'
let curMonth=6;
let curWeekMonday=getMondayOf(TODAY); // Mon of current week
let myMode=false;
const myEmpId='8'; // Mony Leak — change if needed

// ── WEEK BOUNDARY LIMITS ──────────────────────────────────────────────────────
// Earliest: Mon 1 Jun 2026, Latest: Mon 25 Aug 2026 (last full week)
const FIRST_MONDAY=getMondayOf(new Date(2026,5,1)); // Jun 1 is Mon
const LAST_MONDAY=getMondayOf(new Date(2026,7,25));

// ── INIT ──────────────────────────────────────────────────────────────────────
function init(){
  // populate selects
  const empSel=document.getElementById('empFilter');
  const teamSel=document.getElementById('teamFilter');
  EMPLOYEES.filter(e=>!e.oc).forEach(e=>{
    const o=document.createElement('option');o.value=e.id;o.textContent=e.name;empSel.appendChild(o);
  });
  [...new Set(EMPLOYEES.filter(e=>!e.oc).map(e=>e.team))].forEach(t=>{
    const o=document.createElement('option');o.value=t;o.textContent=t;teamSel.appendChild(o);
  });

  // if today is outside Jun–Aug 2026, show first available week
  if(curWeekMonday<FIRST_MONDAY) curWeekMonday=new Date(FIRST_MONDAY);
  if(curWeekMonday>LAST_MONDAY)  curWeekMonday=new Date(LAST_MONDAY);

  // view toggle
  document.getElementById('weekViewBtn').addEventListener('click',()=>setView('week'));
  document.getElementById('monthViewBtn').addEventListener('click',()=>setView('month'));

  // week nav
  document.getElementById('prevWeekBtn').addEventListener('click',()=>shiftWeek(-1));
  document.getElementById('nextWeekBtn').addEventListener('click',()=>shiftWeek(1));
  document.getElementById('todayBtn').addEventListener('click',()=>{
    curWeekMonday=getMondayOf(TODAY);
    if(curWeekMonday<FIRST_MONDAY) curWeekMonday=new Date(FIRST_MONDAY);
    if(curWeekMonday>LAST_MONDAY)  curWeekMonday=new Date(LAST_MONDAY);
    render();
  });

  // month tabs
  document.querySelectorAll('.mtab').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.mtab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      curMonth=parseInt(btn.dataset.month);
      render();
    });
  });

  // filters
  empSel.addEventListener('change',()=>{teamSel.value='all';myMode=false;syncMyBtn();render();});
  teamSel.addEventListener('change',()=>{empSel.value='all';myMode=false;syncMyBtn();render();});

  // my shifts
  document.getElementById('myBtn').addEventListener('click',()=>{
    myMode=!myMode;
    if(myMode){empSel.value='all';teamSel.value='all';}
    syncMyBtn();render();
  });

  // note modal
  document.getElementById('noteMask').addEventListener('click',e=>{
    if(e.target===e.currentTarget||e.target.id==='noteClose') closeNote();
  });

  renderLegend();
  render();
}

function setView(v){
  viewMode=v;
  document.getElementById('weekViewBtn').classList.toggle('active',v==='week');
  document.getElementById('monthViewBtn').classList.toggle('active',v==='month');
  document.getElementById('weekNavRow').style.display=v==='week'?'':'none';
  document.getElementById('monthTabsRow').style.display=v==='month'?'':'none';
  document.getElementById('tblWrap').classList.toggle('week-view',v==='week');
  render();
}

function shiftWeek(n){
  const next=addWeeks(curWeekMonday,n);
  if(next<FIRST_MONDAY||next>LAST_MONDAY) return;
  curWeekMonday=next;
  render();
}

function syncMyBtn(){
  document.getElementById('myBtn').classList.toggle('active',myMode);
}

function getVisible(){
  if(myMode) return EMPLOYEES.filter(e=>e.oc||e.id===myEmpId);
  const ev=document.getElementById('empFilter').value;
  const tv=document.getElementById('teamFilter').value;
  if(ev!=='all') return EMPLOYEES.filter(e=>e.oc||e.id===ev);
  if(tv!=='all') return EMPLOYEES.filter(e=>e.oc||e.team===tv);
  return EMPLOYEES;
}

function openNote(name,label,code,note){
  document.getElementById('noteTitle').textContent=`${name} — ${label} · ${code}`;
  document.getElementById('noteBody').textContent=note;
  document.getElementById('noteMask').classList.add('show');
}
function closeNote(){document.getElementById('noteMask').classList.remove('show');}

function pillHtml(code,note,empName,label){
  if(!code) return `<span class="pill dim">—</span>`;
  const hn=note?'has-note':'';
  const nd=note?` data-note="${note.replace(/"/g,'&quot;')}" data-ename="${empName}" data-label="${label}"`:'';
  return `<span class="pill p${code} ${hn}"${nd}>${code}</span>`;
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render(){
  if(viewMode==='week') renderWeek();
  else renderMonth();
}

function renderWeek(){
  // build the 7 days Mon–Sun
  const days=[];
  for(let i=0;i<7;i++){
    const d=new Date(curWeekMonday);
    d.setDate(d.getDate()+i);
    days.push(d);
  }

  // update week label
  const sun=days[6];
  document.getElementById('weekLabel').textContent=`${fmtShort(curWeekMonday)} – ${fmtShort(sun)}`;

  // disable nav buttons at boundaries
  document.getElementById('prevWeekBtn').style.opacity=curWeekMonday<=FIRST_MONDAY?'0.3':'1';
  document.getElementById('nextWeekBtn').style.opacity=curWeekMonday>=LAST_MONDAY?'0.3':'1';

  const emps=getVisible();
  const DAY_NAMES=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const WEEKEND_IDXS=[5,6]; // Sat, Sun

  let html=`<table><thead><tr><th class="tc">Team</th><th class="nc">Name</th>`;
  days.forEach((d,i)=>{
    const isWE=WEEKEND_IDXS.includes(i);
    const isToday=d.getTime()===TODAY.getTime();
    const cls=[isWE?'wkend':'','day-col',isToday?'today-col':''].filter(Boolean).join(' ');
    const numCls=isToday?'dh-num today-num':'dh-num';
    html+=`<th class="${cls}"><span class="${numCls}">${d.getDate()}</span><span class="dh-name">${DAY_NAMES[i]}</span></th>`;
  });
  html+=`</tr></thead><tbody>`;

  let prevTeam=null;
  emps.forEach(emp=>{
    if(emp.oc){
      html+=`<tr class="dsep"><td class="tc">TL</td><td class="nc">ON Call</td>`;
      days.forEach((d,i)=>{
        const isWE=WEEKEND_IDXS.includes(i);
        const isToday=d.getTime()===TODAY.getTime();
        const cls=[isWE?'wkend':'','day-col',isToday?'today-col':''].filter(Boolean).join(' ');
        const key=dateToRotaKey(d);
        const name=key?((MONTHS[key.month]||{}).oc||{})[key.day]||'':'—';
        html+=`<td class="${cls}"><span class="oc-chip">${name.split(' ')[0]||'—'}</span></td>`;
      });
      html+=`</tr>`;
      return;
    }
    const ds=(emp.team!==prevTeam)?'dsep':'';
    prevTeam=emp.team;
    const isMe=myMode&&emp.id===myEmpId;
    html+=`<tr class="${ds}"><td class="tc">${emp.team}</td><td class="${isMe?'nc me':'nc'}" title="${emp.name}">${emp.name}</td>`;
    days.forEach((d,i)=>{
      const isWE=WEEKEND_IDXS.includes(i);
      const isToday=d.getTime()===TODAY.getTime();
      const cls=[isWE?'wkend':'','day-col',isToday?'today-col':''].filter(Boolean).join(' ');
      const key=dateToRotaKey(d);
      let code=null,note=null;
      if(key){
        code=((emp.s||{})[key.month]||{})[key.day]||null;
        note=((emp.n||{})[key.month]||{})[key.day]||null;
      }
      const label=`${String(d.getDate()).padStart(2,'0')} ${DAY_NAMES[i]}`;
      html+=`<td class="${cls}" style="position:relative">${pillHtml(code,note,emp.name,label)}</td>`;
    });
    html+=`</tr>`;
  });
  html+=`</tbody></table>`;

  const out=document.getElementById('tblOut');
  out.innerHTML=html;
  attachNoteHandlers(out);
}

function renderMonth(){
  const m=MONTHS[curMonth];
  const emps=getVisible();
  const days=Array.from({length:m.days},(_,i)=>i+1);

  let html=`<table><thead><tr><th class="tc">Team</th><th class="nc">Name</th>`;
  days.forEach(d=>{
    const wS=m.ws.includes(d)?'wksep':'';
    const wE=m.we.includes(d)?'wkend':'';
    const isToday=(curMonth===TODAY.getMonth()+1&&d===TODAY.getDate()&&TODAY.getFullYear()===2026);
    const tc=isToday?'today-col':'';
    html+=`<th class="${[wS,wE,tc].filter(Boolean).join(' ')}" style="min-width:28px">
      <span style="display:block;font-size:8px;opacity:.7">${String(d).padStart(2,'0')}</span>
      <span style="display:block;font-size:8px">${m.dn[d-1]}</span></th>`;
  });
  html+=`</tr></thead><tbody>`;

  let prevTeam=null;
  emps.forEach(emp=>{
    if(emp.oc){
      html+=`<tr class="dsep"><td class="tc">TL</td><td class="nc">ON Call</td>`;
      days.forEach(d=>{
        const wS=m.ws.includes(d)?'wksep':'';
        const wE=m.we.includes(d)?'wkend':'';
        const isToday=(curMonth===TODAY.getMonth()+1&&d===TODAY.getDate()&&TODAY.getFullYear()===2026);
        const tc=isToday?'today-col':'';
        const short=((m.oc[d])||'').split(' ')[0];
        html+=`<td class="${[wS,wE,tc].filter(Boolean).join(' ')}"><span class="oc-chip">${short}</span></td>`;
      });
      html+=`</tr>`;
      return;
    }
    const ds=(emp.team!==prevTeam)?'dsep':'';
    prevTeam=emp.team;
    const sh=(emp.s||{})[curMonth]||{};
    const no=(emp.n||{})[curMonth]||{};
    const isMe=myMode&&emp.id===myEmpId;
    html+=`<tr class="${ds}"><td class="tc">${emp.team}</td><td class="${isMe?'nc me':'nc'}" title="${emp.name}">${emp.name}</td>`;
    days.forEach(d=>{
      const wS=m.ws.includes(d)?'wksep':'';
      const wE=m.we.includes(d)?'wkend':'';
      const isToday=(curMonth===TODAY.getMonth()+1&&d===TODAY.getDate()&&TODAY.getFullYear()===2026);
      const tc=isToday?'today-col':'';
      const label=`${String(d).padStart(2,'0')} ${m.dn[d-1]}`;
      html+=`<td class="${[wS,wE,tc].filter(Boolean).join(' ')}" style="position:relative">${pillHtml(sh[d]||null,no[d]||null,emp.name,label)}</td>`;
    });
    html+=`</tr>`;
  });
  html+=`</tbody></table>`;

  const out=document.getElementById('tblOut');
  out.innerHTML=html;
  attachNoteHandlers(out);

  // scroll today into view in month mode
  if(curMonth===TODAY.getMonth()+1&&TODAY.getFullYear()===2026){
    setTimeout(()=>{
      const tc=out.querySelector('th.today-col');
      if(tc) tc.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
    },80);
  }
}

function attachNoteHandlers(out){
  out.querySelectorAll('.pill.has-note').forEach(pill=>{
    pill.addEventListener('click',e=>{
      e.stopPropagation();
      openNote(pill.dataset.ename,pill.dataset.label,pill.textContent.trim(),pill.dataset.note);
    });
  });
}

function renderLegend(){
  document.getElementById('legend').innerHTML=
    '<span style="font-size:11px;color:var(--muted);margin-right:4px;align-self:center">Key:</span>'+
    LEGEND_CODES.map(x=>`<span class="lchip l${x.c}"><b>${x.c}</b> ${x.l}</span>`).join('');
}


// ── LIVE DATA LOADER ─────────────────────────────────────────────────────────
// Fetches rota-data.json pushed by the extension and merges shifts into MONTHS/EMPLOYEES
async function loadLiveData() {
  try {
    const url = 'https://raw.githubusercontent.com/Mony-VF/rota/main/rota-data.json?t=' + Date.now();
    const resp = await fetch(url);
    if (!resp.ok) return; // no live data yet, use hardcoded
    const data = await resp.json();
    if (!data || !data.employees) return;

    const m = data.month;
    if (!m || !MONTHS[m]) return;

    // Update OC row
    if (data.oc) MONTHS[m].oc = data.oc;

    // Update employee shifts & notes
    data.employees.forEach(liveEmp => {
      const emp = EMPLOYEES.find(e => e.name === liveEmp.name);
      if (!emp) return;
      if (!emp.s) emp.s = {};
      if (!emp.n) emp.n = {};
      emp.s[m] = liveEmp.shifts || {};
      emp.n[m] = liveEmp.notes || {};
    });

    // Show last updated badge
    if (data.updatedAt) {
      const d = new Date(data.updatedAt);
      const label = d.toLocaleDateString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
      const badge = document.createElement('span');
      badge.style.cssText = 'font-size:10px;color:#65F2C4;margin-left:8px;opacity:.8;';
      badge.textContent = '✓ Live ' + label;
      document.querySelector('.bar-title').appendChild(badge);
    }

    // Switch to the live month
    curMonth = m;
    document.querySelectorAll('.mtab').forEach(b => {
      b.classList.toggle('active', parseInt(b.dataset.month) === m);
    });

  } catch(e) {
    // silently fail — hardcoded data still works
  }
}

// kick off week-view mode with correct tblWrap class
document.getElementById('tblWrap').classList.add('week-view');
loadLiveData().then(() => init());
