*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:radial-gradient(900px 500px at 20% -10%,rgba(110,168,255,.18),transparent 55%),radial-gradient(900px 500px at 80% 0%,rgba(124,92,255,.16),transparent 55%),var(--bg);color:var(--text);min-height:100vh;}
.wrap{padding:16px 12px 32px;}
.bar{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.05));border:1px solid var(--stroke);border-radius:var(--radius);padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.bar-title{font-size:18px;font-weight:700;letter-spacing:.2px;margin-right:4px;}
.month-tabs{display:flex;gap:6px;flex-wrap:wrap;}
.mtab{background:rgba(255,255,255,.07);border:1px solid var(--stroke);color:var(--muted);border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer;transition:background .15s,color .15s;}
.mtab:hover{background:rgba(255,255,255,.12);}
.mtab.active{background:rgba(110,168,255,.22);border-color:rgba(110,168,255,.45);color:var(--text);}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto;}
.ctl label{font-size:12px;color:var(--muted);}
.ctl select{background:rgba(255,255,255,.08);border:1px solid var(--stroke);color:var(--text);border-radius:8px;padding:6px 10px;font-size:13px;outline:none;}
.tbl-wrap{overflow-x:auto;border:1px solid var(--stroke);border-radius:var(--radius);background:rgba(255,255,255,.03);}
table{border-collapse:separate;border-spacing:0;font-size:11px;width:max-content;min-width:100%;}
th,td{padding:4px 3px;text-align:center;vertical-align:middle;border-bottom:0.5px solid rgba(255,255,255,.07);white-space:nowrap;position:relative;}
th{background:rgba(15,26,51,.97);color:var(--muted);font-weight:500;position:sticky;top:0;z-index:4;border-bottom:1px solid rgba(255,255,255,.14);}
th.tc,td.tc{position:sticky;left:0;z-index:5;width:var(--sticky-team);min-width:var(--sticky-team);max-width:var(--sticky-team);background:var(--panel)!important;border-right:0.5px solid rgba(255,255,255,.10);text-align:left;padding-left:8px;font-size:10px;color:var(--muted);}
th.nc,td.nc{position:sticky;left:var(--sticky-team);z-index:5;width:var(--sticky-name);min-width:var(--sticky-name);max-width:var(--sticky-name);background:var(--panel)!important;border-right:0.5px solid rgba(255,255,255,.10);text-align:left;padding-left:8px;font-weight:500;overflow:hidden;text-overflow:ellipsis;}
th.tc,th.nc{z-index:6;}
.wkend{background:rgba(255,255,255,.025);}
.wksep{border-left:2px solid rgba(110,168,255,.7)!important;}
tr.dsep td{border-top:2px solid rgba(110,168,255,.8)!important;}
.pill{display:inline-flex;align-items:center;justify-content:center;padding:2px 6px;border-radius:7px;font-size:10.5px;font-weight:700;border:1px solid rgba(0,0,0,.3);color:#000;min-width:30px;}
.pill.pH,.pill.pS{color:#fff!important;}
.pE{background:var(--c-E)}.pSE{background:var(--c-SE)}.p1{background:var(--c-1)}.pL{background:var(--c-L)}.pSL{background:var(--c-SL)}.pW{background:var(--c-W)}.pSN{background:var(--c-SN)}.pH{background:var(--c-H)}.pHD{background:var(--c-HD)}.pS{background:var(--c-S)}.pMA{background:var(--c-MA)}.pT{background:var(--c-T)}.pM{background:var(--c-M)}.pCL{background:var(--c-CL)}.pDL{background:var(--c-DL)}
.pill.has-note::after{content:'';position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:#ff3b3b;}
.pill.dim{background:transparent;border-color:transparent;color:rgba(185,196,230,.25);font-weight:400;}
.note-tip{display:none;position:absolute;z-index:999;background:rgba(15,26,51,.97);border:1px solid rgba(110,168,255,.3);border-radius:8px;padding:8px 10px;font-size:11px;max-width:200px;line-height:1.5;color:var(--text);box-shadow:0 4px 18px rgba(0,0,0,.4);pointer-events:none;white-space:normal;left:0;top:calc(100% + 4px);}
td:hover .note-tip{display:block;}
.oc-chip{display:inline-block;background:rgba(255,255,255,.07);border:0.5px solid rgba(255,255,255,.14);border-radius:999px;padding:2px 8px;font-size:10px;color:var(--muted);}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
.lchip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;border:1px solid rgba(0,0,0,.25);font-size:11px;color:#000;}
.lchip.lH,.lchip.lS{color:#fff!important;}
.lchip.lE{background:var(--c-E)}.lchip.lSE{background:var(--c-SE)}.lchip.l1{background:var(--c-1)}.lchip.lL{background:var(--c-L)}.lchip.lSL{background:var(--c-SL)}.lchip.lW{background:var(--c-W)}.lchip.lSN{background:var(--c-SN)}.lchip.lH{background:var(--c-H)}.lchip.lHD{background:var(--c-HD)}.lchip.lS{background:var(--c-S)}.lchip.lMA{background:var(--c-MA)}.lchip.lT{background:var(--c-T)}.lchip.lM{background:var(--c-M)}.lchip.lCL{background:var(--c-CL)}.lchip.lDL{background:var(--c-DL)}
</style>
</head>

      6:{1:'1',2:'1',3:'1',4:'1',5:'1',8:'1',9:'1',10:'1',11:'1',12:'1',15:'1',16:'1',17:'1',18:'1',19:'1',22:'1',23:'1',24:'1',25:'1',26:'1',29:'1',30:'1'},
      7:{1:'1',2:'1',3:'1',6:'1',7:'1',8:'1',9:'1',10:'1',13:'1',14:'1',15:'1',16:'1',17:'1',20:'1',21:'1',22:'1',23:'1',24:'1',27:'1',28:'1',29:'H',30:'H',31:'H'},
      8:{3:'H',4:'H',5:'H',6:'1',7:'1',10:'1',11:'1',12:'1',13:'1',14:'1',17:'1',18:'1',19:'1',20:'1',21:'1',24:'1',25:'1',26:'1',27:'1',28:'1'},
    },
    notes:{6:{},7:{},8:{}}
  },
  {id:'18', name:'Hannah Shephard',      team:'Team Leader', shifts:{6:{},7:{},8:{}}, notes:{6:{},7:{},8:{}}},

    shifts:{
      6:{1:'T',2:'T'},
      7:{24:'H'},

    notes:{6:{},7:{},8:{}}

const LEGEND_CODES=[
  {c:'E',l:'Early'},{c:'SE',l:'Sat Early'},{c:'1',l:'Regular'},
  {c:'L',l:'Late'},{c:'SL',l:'Sat Late'},{c:'SN',l:'Sat Normal'},
  {c:'W',l:'Sunday'},{c:'H',l:'Holiday'},{c:'HD',l:'Half-day'},
  {c:'S',l:'Sick'},{c:'MA',l:'Medical Appt'},{c:'T',l:'Training'},
  {c:'M',l:'Mat/Pat Leave'},{c:'CL',l:'Compassionate'},{c:'DL',l:'Dependency'},
];

// ── STATE ──────────────────────────────────────────────────────────────────────
let currentMonth = 6;

// ── INIT ───────────────────────────────────────────────────────────────────────
function init(){
  const empSel = document.getElementById('empFilter');
  const teamSel = document.getElementById('teamFilter');

  EMPLOYEES.filter(e=>!e.oc).forEach(e=>{
    const o = document.createElement('option');
    o.value = e.id; o.textContent = e.name;
    empSel.appendChild(o);
  });
  [...new Set(EMPLOYEES.filter(e=>!e.oc).map(e=>e.team))].forEach(t=>{
    const o = document.createElement('option');
    o.value = t; o.textContent = t;
    teamSel.appendChild(o);
  });

  document.querySelectorAll('.mtab').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.mtab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      currentMonth = parseInt(btn.dataset.month);
      render();
    });
  });

  empSel.addEventListener('change',()=>{ if(empSel.value!=='all') teamSel.value='all'; render(); });
  teamSel.addEventListener('change',()=>{ if(teamSel.value!=='all') empSel.value='all'; render(); });

  renderLegend();
  render();
}

function getVisible(){
  const ev = document.getElementById('empFilter').value;
  const tv = document.getElementById('teamFilter').value;
  if(ev!=='all') return EMPLOYEES.filter(e=>e.id===ev||e.oc);
  if(tv!=='all') return EMPLOYEES.filter(e=>e.oc||e.team===tv);
  return EMPLOYEES;
}

function pillHtml(code, note){
  if(!code) return `<span class="pill dim">—</span>`;
  const hn = note ? 'has-note' : '';
  const tip = note ? `<div class="note-tip">${note}</div>` : '';
  return `<span class="pill p${code} ${hn}" title="${note||''}">${code}${tip}</span>`;
}

function render(){
  const m = MONTHS[currentMonth];
  const emps = getVisible();
  const days = Array.from({length:m.days},(_,i)=>i+1);

  let html = `<table><thead><tr>
    <th class="tc">Team</th>
    <th class="nc">Name</th>`;
  days.forEach(d=>{
    const wS = m.weekSeps.includes(d) ? 'wksep' : '';
    const wE = m.weekends.includes(d) ? 'wkend' : '';
    html += `<th class="${wS} ${wE}" style="min-width:36px"><span style="display:block;font-size:9px;color:var(--muted)">${String(d).padStart(2,'0')}</span><span style="display:block;font-size:9px">${m.dayNames[d-1]}</span></th>`;
  });
  html += `</tr></thead><tbody>`;

  let prevTeam = null;
  emps.forEach(emp=>{
    if(emp.oc){
      html += `<tr class="dsep"><td class="tc">TL</td><td class="nc">ON Call</td>`;
      days.forEach(d=>{
        const wS = m.weekSeps.includes(d) ? 'wksep' : '';
        const wE = m.weekends.includes(d) ? 'wkend' : '';
        html += `<td class="${wS} ${wE}"><span class="oc-chip">${m.oc[d]||''}</span></td>`;
      });
      html += `</tr>`;
      return;
    }
    const ds = (emp.team !== prevTeam) ? 'dsep' : '';
    prevTeam = emp.team;
    const sh = (emp.shifts||{})[currentMonth]||{};
    const no = (emp.notes||{})[currentMonth]||{};
    html += `<tr class="${ds}"><td class="tc">${emp.team}</td><td class="nc" title="${emp.name}">${emp.name}</td>`;
    days.forEach(d=>{
      const wS = m.weekSeps.includes(d) ? 'wksep' : '';
      const wE = m.weekends.includes(d) ? 'wkend' : '';
      html += `<td class="${wS} ${wE}" style="position:relative">${pillHtml(sh[d]||null, no[d]||null)}</td>`;
    });
    html += `</tr>`;
  });
  html += `</tbody></table>`;
  document.getElementById('tblOut').innerHTML = html;
}

function renderLegend(){
  document.getElementById('legend').innerHTML =
    '<span style="font-size:12px;color:var(--muted);margin-right:4px">Key:</span>' +
    LEGEND_CODES.map(x=>`<span class="lchip l${x.c}"><b>${x.c}</b> ${x.l}</span>`).join('');
}

init();
</script>
</body>
</html>
